name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/EstantePinturas-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EstantePinturas-${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Estante de Pinturas 1.0.${{ github.run_number }}
          body: APK compilado del commit ${{ github.sha }}. Descárgalo desde el teléfono e instálalo encima de la versión anterior.
          files: dist/*.apk
          make_latest: true
