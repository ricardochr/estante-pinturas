name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - "README.md"
  workflow_run:
    workflows: ["Actualizar catálogo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Revisar traducciones
        run: |
          python3 tools/i18n_wrap.py --write
          # Textos nuevos sin envolver para traducir, o claves sin traducción: falla
          git diff --exit-code -- app/src/main/java || (echo "Hay textos sin preparar para traducir: corre tools/i18n_wrap.py --write" && exit 1)
          python3 tools/i18n_build.py --check

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
          mkdir -p dist
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/Gotario-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/Gotario-${{ github.run_number }}-32bits.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gotario-${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotario 1.0.${{ github.run_number }}
          body: APK compilado del commit ${{ github.sha }}. Descárgalo desde el teléfono e instálalo encima de la versión anterior. Gotario-N.apk es para teléfonos de 64 bits (casi todos); usa el de 32 bits solo si el otro no se instala.
          files: dist/*.apk
          make_latest: true
