name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - "README.md"
  workflow_run:
    workflows: ["Actualizar catálogo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Gotario-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gotario-${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotario 1.0.${{ github.run_number }}
          body: APK compilado del commit ${{ github.sha }}. Descárgalo desde el teléfono e instálalo encima de la versión anterior.
          files: dist/*.apk
          make_latest: true
