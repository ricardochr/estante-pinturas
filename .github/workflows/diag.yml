name: Diagnóstico
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd /tmp && python3 $GITHUB_WORKSPACE/tools/diag/sheet.py
          for f in /tmp/sheet-*.csv; do echo "##### $f"; cat "$f"; echo; done
