name: Actualizar catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # cada lunes
  push:
    branches: [main]
    paths:
      - tools/update_catalog.py
      - tools/imgcolor.py
      - tools/colornames.py
      - tools/color-overrides.json
      - tools/validate_colors.py

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias y datos abiertos
        run: |
          pip install pillow
          git clone --depth 1 https://github.com/s10-steve/paintdex /tmp/paintdex
          git clone --depth 1 https://github.com/Arcturus5404/miniature-paints /tmp/miniature-paints

      - name: Descargar tiendas y armar catálogo
        run: python3 tools/update_catalog.py --fetch --paintdex /tmp/paintdex/data --miniature-paints /tmp/miniature-paints

      - name: Validar colores contra fuentes independientes
        run: python3 tools/validate_colors.py --paintdex /tmp/paintdex/data --miniature-paints /tmp/miniature-paints --write-flags

      - name: Guardar cambios
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add app/src/main/assets/catalog.json app/src/main/assets/sets.json tools/catalog-report.md tools/sets-report.md tools/colors-report.md tools/color-cache-v3.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo"
          else
            git commit -m "Catálogo actualizado $(date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
