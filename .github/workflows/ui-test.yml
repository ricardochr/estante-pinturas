name: Pruebas en emulador

# Abre las pantallas de la app en un emulador Android y guarda el error si alguna se cierra.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - "README.md"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            chmod +x gradlew
            adb logcat -c || true
            ./gradlew connectedDebugAndroidTest --no-daemon || (adb logcat -d > logcat.txt; exit 1)
            adb logcat -d > logcat.txt
      - name: Errores fatales
        if: always()
        run: |
          [ -f logcat.txt ] && grep -A45 "FATAL EXCEPTION" logcat.txt | head -150 || echo "sin logcat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-emulador
          path: |
            logcat.txt
            app/build/reports/androidTests/
